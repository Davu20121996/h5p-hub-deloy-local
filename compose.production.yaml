name: h5p-hub-production

# Run this file on its own, behind an HTTPS reverse proxy or Cloudflare Tunnel.
# docker compose --env-file deploy/env.production -f compose.production.yaml up -d --build
# Keep the project name and volumes unchanged when updating an existing deployment.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: h5p-hub-production-app:local
  pull_policy: build
  build:
    context: .
    dockerfile: docker/php/Dockerfile.production
    target: production
  restart: unless-stopped
  init: true
  stop_grace_period: 150s
  security_opt:
    - no-new-privileges:true
  logging: *logging
  environment: &environment
    APP_NAME: H5P Hub
    APP_ENV: production
    APP_KEY: ${APP_KEY:?Set APP_KEY in Dockhand}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?Set APP_URL in Dockhand}
    LTI_MANAGED_CLIENT_URL: ${LTI_MANAGED_CLIENT_URL:-}
    HUB_PROVISIONING_SECRET: ${HUB_PROVISIONING_SECRET:-}
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    LTI_DEMO_ENABLED: "false"
    LTI_ALLOW_HTTP: "false"
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
    SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
    SESSION_PARTITIONED_COOKIE: "true"
    SESSION_ENCRYPT: "true"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: h5p
    DB_USERNAME: h5p
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dockhand}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    # Must exceed the worker's 120-second timeout to avoid duplicate jobs.
    DB_QUEUE_RETRY_AFTER: 180
  volumes:
    - h5p_storage:/var/www/html/storage
  networks: [internal]

services:
  init:
    <<: *app
    user: "0:0"
    restart: "no"
    entrypoint: ["sh", "/usr/local/bin/production-init.sh"]
    environment:
      <<: *environment
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600", "--no-interaction"]
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    image: h5p-hub-production-web:local
    pull_policy: build
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: web
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    networks: [internal]
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      # /up is an Nginx-only response; /login also verifies Laravel and PHP-FPM.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: h5p
      POSTGRES_USER: h5p
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dockhand}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h5p -d h5p"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  h5p_storage:
  postgres:
networks:
  internal:
    driver: bridge
