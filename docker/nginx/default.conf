log_format hub '$remote_addr - $request_method $uri $status $body_bytes_sent';
server {
    access_log /var/log/nginx/access.log hub;
    listen 80;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 55m;

    # Gzip compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/vnd.ms-fontobject;

    # Laravel serves H5P assets and authorizes workspace file requests.
    location ~ ^/(h5p-assets/|workspace/[^/]+/files/|admin/tenants/[^/]+/contents/[^/]+/files/) {
        try_files $uri /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check endpoint
    location /up {
        return 200 'OK';
        add_header Content-Type text/plain;
        access_log off;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_keep_conn on;
        fastcgi_next_upstream error timeout invalid_header;
        fastcgi_next_upstream_tries 3;
        fastcgi_next_upstream_timeout 10s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "storage-access=*" always;
    }
    location ~ /\..* { deny all; }
}
