[www]
user = www-data
group = www-data
pm = dynamic
pm.max_children = 50
pm.start_servers = 8
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_spawn_rate = 32
pm.max_requests = 500
listen = 9000
listen.backlog = 511
pm.status_path = /status
ping.path = /ping
request_terminate_timeout = 300
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm-slow.log
